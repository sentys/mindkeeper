# Перенаправляем HTTP на HTTPS
server {
    listen 80;
    server_name mindkeeper.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mindkeeper.localhost;

    # Пути к сертификатам (внутри контейнера)
    ssl_certificate     /etc/nginx/certs/mindkeeper.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/mindkeeper.localhost-key.pem;

    # Сжатие
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Запросы к API (твой бэкенд)
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Все остальные запросы (твой фронтенд)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}