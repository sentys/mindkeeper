services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    container_name: mindkeeper-backend
    ports:
      - "4000:4000"
    env_file:
      - ../backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    container_name: mindkeeper-frontend
    ports:
      - "5173:5173"
    env_file:
      - ../frontend/.env
    depends_on:
      - backend
    restart: unless-stopped
    
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

    